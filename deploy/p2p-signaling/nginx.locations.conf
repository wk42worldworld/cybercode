# Include these locations inside the existing www.mybotworld.com HTTPS server.
location = /cybercode-p2p/health {
    access_log off;
    proxy_pass http://127.0.0.1:8765/health;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /cybercode-p2p/p2p/ws {
    access_log off;
    proxy_pass http://127.0.0.1:8765/p2p/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_buffering off;
}
